name: ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      options: --init

    steps:
      - name: Install build and test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git file bash zsh python3 util-linux build-essential vim-tiny less procps

      - uses: actions/checkout@v4

      - name: Install Sun toolchain
        run: bash tools/setup-ci.sh

      - name: Build and verify Linux binary
        run: |
          ./build.sh
          bash tools/check-linkage.sh

      - name: Test
        run: |
          ./test.sh
          ./test-zsh.sh
          python3 test-terminal.py
          bash ./test-workspace.sh

      - name: Shellcheck
        continue-on-error: true
        run: |
          apt-get install -y --no-install-recommends shellcheck || exit 0
          shellcheck -S warning shell/*.bash install.sh build.sh run.sh test.sh test-zsh.sh packaging/*.sh || true

  macos-arm64:
    # Sun's bundled OpenSSL archives need the newer Apple archive reader.
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"

    steps:
      - uses: actions/checkout@v4

      - name: Install Sun toolchain
        run: bash tools/setup-ci.sh

      - name: Build and verify macOS binary
        run: |
          bash ./build.sh
          file bin/namo_complete
          file bin/namo_complete | grep -q 'arm64'
          bash tools/check-linkage.sh

      - name: Test
        run: |
          bash ./test.sh
          ./test-zsh.sh
          python3 test-terminal.py
          bash ./test-workspace.sh
