name: ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      options: --init

    steps:
      - name: Install build and test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git file bash zsh python3 util-linux build-essential

      - uses: actions/checkout@v4

      - name: Install latest Sun dev artifact
        run: |
          curl -fsSL -o /tmp/sun.deb \
            https://github.com/namo-robotics/sun/releases/download/dev/sun_0.dev_amd64.deb
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends /tmp/sun.deb
          sun --version

      - name: Build and verify Linux binary
        run: |
          ./build.sh
          file bin/namo_complete
          if ! file bin/namo_complete | grep -Eq 'static-pie linked|statically linked'; then
            echo "::error::binary is not statically linked"
            exit 1
          fi

      - name: Test
        run: |
          ./test.sh
          ./test-zsh.sh

      - name: Shellcheck
        continue-on-error: true
        run: |
          apt-get install -y --no-install-recommends shellcheck || exit 0
          shellcheck -S warning shell/*.bash install.sh build.sh run.sh test.sh test-zsh.sh packaging/*.sh || true

  macos-arm64:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        # Bash only exercises the optional Bash integration; macOS users run zsh.
        run: brew install llvm@20 bash

      - name: Install latest Sun dev artifact
        run: |
          test "$(uname -m)" = arm64
          curl -fsSL -o /tmp/sun.tar.gz \
            https://github.com/namo-robotics/sun/releases/download/dev/sun-0.dev-arm64-apple-darwin.tar.gz
          mkdir -p /tmp/sun
          tar -C /tmp/sun -xzf /tmp/sun.tar.gz
          echo "/tmp/sun/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Build and verify macOS binary
        run: |
          sun --version
          bash ./build.sh
          file bin/namo_complete
          file bin/namo_complete | grep -q 'arm64'
          otool -L bin/namo_complete
          if otool -L bin/namo_complete | grep -Eq 'lib(ssl|crypto)'; then
            echo "::error::binary unexpectedly depends on shared OpenSSL"
            exit 1
          fi

      - name: Test
        run: |
          bash ./test.sh
          ./test-zsh.sh
