name: release

on:
  push:
    branches: [main]        # rolling "dev" release, overwritten each merge
    tags: ["v*"]            # immutable versioned release
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (blank = dev)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: ubuntu:26.04

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git file bash \
            python3 util-linux \
            build-essential
        # build-essential is required: `sun -c` shells out to cc/ld to link, and
        # static linking needs libc.a. `gcc` + `libc6-dev` alone is NOT enough.
        # libllvm20 etc are declared by the Sun package and resolved by apt.

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # need tags to force-move `dev`

      - name: Resolve version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            V="$GITHUB_REF_NAME"; DEV=false
          else
            V="${{ github.event.inputs.version }}"; V="${V:-dev}"
            if [ "$V" = dev ]; then DEV=true; else DEV=false; fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "dev=$DEV" >> "$GITHUB_OUTPUT"
          echo "building $V (prerelease=$DEV)"

      - name: Install Sun toolchain
        run: |
          curl -fsSL -o /tmp/sun.deb \
            https://github.com/namo-robotics/sun/releases/download/dev/sun_0.dev_amd64.deb
          # `apt-get install ./file.deb` resolves the package's dependencies;
          # `dpkg -i` would not.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends /tmp/sun.deb
          sun --version | tee /tmp/sun-version.txt

      - name: Build
        # The version is stamped into the binary, so `namo_complete --version`
        # on a user's machine names the release it came from and the commit it
        # was built at -- `dev` is a rolling tag and identifies nothing on its own.
        run: NAMO_VERSION="${{ steps.v.outputs.version }}" ./build.sh

      - name: Verify the binary is statically linked
        run: |
          file bin/namo_complete
          if ldd bin/namo_complete 2>&1 | grep -qv 'not a dynamic executable'; then
            echo "::error::binary is dynamically linked; it will not be portable"
            exit 1
          fi

      - name: Test
        run: ./test.sh

      - name: Package
        id: pkg
        run: |
          NAME=$(NAMO_BUILT_WITH="$(cat /tmp/sun-version.txt)" \
                 ./packaging/package.sh "${{ steps.v.outputs.version }}")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the packaged artifact
        run: |
          set -euo pipefail
          NAME="${{ steps.pkg.outputs.name }}"
          TMP=$(mktemp -d)
          tar -C "$TMP" -xzf "dist/$NAME.tar.gz"
          "$TMP/$NAME/install.sh" --prefix "$TMP/prefix" --no-bashrc
          test -x "$TMP/prefix/bin/namo_complete"
          out=$(NAMO_LINE='gi' NAMO_CWD="$PWD" "$TMP/prefix/bin/namo_complete" </dev/null)
          [ -z "$out" ] || { echo "::error::unexpected output: $out"; exit 1; }

      - name: Move the dev tag
        if: steps.v.outputs.dev == 'true'
        # Force-move `dev` to this commit so the rolling release points at the
        # build it actually contains.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git tag -f dev
          git push -f origin refs/tags/dev

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.version }}
          name: ${{ steps.v.outputs.dev == 'true' && 'dev (rolling)' || format('namo_complete {0}', steps.v.outputs.version) }}
          prerelease: ${{ steps.v.outputs.dev == 'true' }}
          generate_release_notes: ${{ steps.v.outputs.dev != 'true' }}
          files: |
            dist/${{ steps.pkg.outputs.name }}.tar.gz
            dist/SHA256SUMS
