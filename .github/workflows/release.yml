name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (blank = dev)"
        required: false

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    container: ubuntu:26.04

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git file bash zsh python3 util-linux build-essential vim-tiny less procps

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then V="$GITHUB_REF_NAME"; else V="${{ github.event.inputs.version }}"; V="${V:-dev}"; fi
          echo "value=$V" >> "$GITHUB_OUTPUT"

      - name: Install Sun toolchain
        run: bash tools/setup-ci.sh

      - name: Build, test, and package
        id: package
        run: |
          NAMO_VERSION="${{ steps.version.outputs.value }}" ./build.sh
          bash tools/check-linkage.sh
          ./test.sh
          ./test-zsh.sh
          bash ./test-workspace.sh
          NAME=$(NAMO_BUILT_WITH="$(cat /tmp/sun-version.txt)" ./packaging/package.sh "${{ steps.version.outputs.value }}")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Smoke-test package
        run: |
          NAME="${{ steps.package.outputs.name }}"
          TMP=$(mktemp -d)
          tar -C "$TMP" -xzf "dist/$NAME.tar.gz"
          sh "$TMP/$NAME/install.sh" --prefix "$TMP/prefix" --no-rc
          "$TMP/prefix/bin/namo_complete" --version

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist/*.tar.gz

  macos-arm64:
    # Sun's bundled OpenSSL archives need the newer Apple archive reader.
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then V="$GITHUB_REF_NAME"; else V="${{ github.event.inputs.version }}"; V="${V:-dev}"; fi
          echo "value=$V" >> "$GITHUB_OUTPUT"

      - name: Install Sun toolchain
        run: bash tools/setup-ci.sh

      - name: Build, test, and package
        id: package
        run: |
          NAMO_VERSION="${{ steps.version.outputs.value }}" bash ./build.sh
          file bin/namo_complete | grep -q 'arm64'
          bash tools/check-linkage.sh
          bash ./test.sh
          ./test-zsh.sh
          bash ./test-workspace.sh
          NAME=$(NAMO_BUILT_WITH="$(cat /tmp/sun-version.txt)" bash ./packaging/package.sh "${{ steps.version.outputs.value }}")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Smoke-test package
        run: |
          NAME="${{ steps.package.outputs.name }}"
          TMP=$(mktemp -d)
          tar -C "$TMP" -xzf "dist/$NAME.tar.gz"
          zsh "$TMP/$NAME/install.sh" --prefix "$TMP/prefix" --no-rc
          "$TMP/prefix/bin/namo_complete" --version

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: dist/*.tar.gz

  publish:
    needs: [linux, macos-arm64]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Resolve release metadata and checksums
        id: release
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then V="$GITHUB_REF_NAME"; DEV=false; else V="${{ github.event.inputs.version }}"; V="${V:-dev}"; [ "$V" = dev ] && DEV=true || DEV=false; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "dev=$DEV" >> "$GITHUB_OUTPUT"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Move rolling dev tag
        if: steps.release.outputs.dev == 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git tag -f dev
          git push -f origin refs/tags/dev

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.version }}
          name: ${{ steps.release.outputs.dev == 'true' && 'dev (rolling)' || format('namo_complete {0}', steps.release.outputs.version) }}
          prerelease: ${{ steps.release.outputs.dev == 'true' }}
          generate_release_notes: ${{ steps.release.outputs.dev != 'true' }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
